<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Experiment timeline</title>
<style>
  :root {
    --bg: #0f1117; --panel: #171a23; --panel2: #1e222d; --line: #2a2f3c;
    --fg: #e6e9ef; --muted: #8a93a6; --accent: #6ea8fe;
    --assistant: #b794f6; --command: #6ea8fe; --msg: #6ea8fe; --pin: #f6ad55;
    --idle: #5b6273; --system: #f6ad55; --status: #fc8181; --warning: #ecc94b;
    --code: #c6ccd8; --prev: #aeb6c6; --epoch-grad: linear-gradient(90deg,#202637,#171a23);
    --col-w: 300px;
  }
  body.light {
    --bg: #f6f7f9; --panel: #ffffff; --panel2: #eef1f5; --line: #d6dbe3;
    --fg: #1c2330; --muted: #667085; --accent: #2563eb;
    --assistant: #7c3aed; --command: #2563eb; --msg: #2563eb; --pin: #c2410c;
    --idle: #98a2b3; --system: #b45309; --status: #dc2626; --warning: #b7791f;
    --code: #344054; --prev: #475467; --epoch-grad: linear-gradient(90deg,#e3ebf7,#ffffff);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  pre { margin: 6px 0 0; white-space: pre-wrap; word-break: break-word; font-size: 12px;
        font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; color: var(--code); }
  a { color: var(--accent); }

  #toolbar { position: sticky; top: 0; z-index: 30; background: var(--panel);
             border-bottom: 1px solid var(--line); padding: 8px 14px; display: flex;
             flex-wrap: wrap; gap: 14px; align-items: center; }
  #toolbar .title { font-weight: 600; margin-right: 6px; }
  #toolbar .group { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  #toolbar label { color: var(--muted); cursor: pointer; user-select: none; }
  #toolbar input[type=checkbox] { vertical-align: -2px; }
  #toolbar button { background: var(--panel2); color: var(--fg); border: 1px solid var(--line);
                    border-radius: 6px; padding: 4px 10px; cursor: pointer; }
  #toolbar button:hover { border-color: var(--accent); }
  #search { background: var(--panel2); color: var(--fg); border: 1px solid var(--line);
            border-radius: 6px; padding: 4px 8px; min-width: 200px; }

  #headerbar { position: sticky; top: 41px; z-index: 20; background: var(--panel2);
               border-bottom: 1px solid var(--line); display: grid; }
  #headerbar .gutter { padding: 6px; }
  #headerbar .host { padding: 8px 10px; font-weight: 600; border-left: 1px solid var(--line);
                     text-align: center; }

  .epoch { border-bottom: 2px solid var(--line); }
  .epoch-head { position: sticky; top: 78px; z-index: 10; background: var(--epoch-grad);
                padding: 5px 14px; color: var(--accent); font-weight: 600; letter-spacing: .3px;
                border-top: 1px solid var(--line); display: flex; gap: 12px; align-items: baseline; }
  .epoch-head .range { color: var(--muted); font-weight: 400; font-size: 11px; }
  .grid { display: grid; padding: 8px 0; column-gap: 12px; align-items: start; }
  .gutter-ts { grid-column: 1; color: var(--muted); font-size: 11px; text-align: right;
               padding-right: 8px; font-family: ui-monospace, monospace; padding-top: 9px; }
  .cell { display: flex; flex-direction: column; gap: 4px; min-width: 0; }

          border-radius: 7px; padding: 7px 9px; margin: 2px 0; min-width: 0; }
  .card .head { display: flex; gap: 6px; align-items: baseline; }
  .card .ttl { font-weight: 600; word-break: break-word; }
  .card .reason { color: var(--muted); font-style: italic; margin-top: 3px; }
  .card details { margin-top: 4px; }
  .card summary { cursor: pointer; color: var(--muted); outline: none; }
  .card summary .prev { color: var(--prev); font-style: normal; }
  /* Collapsed shows the preview; expanding reveals the full text instead of repeating it. */
  .card details[open] summary .prev { display: none; }
  .badge { font-size: 10px; padding: 1px 6px; border-radius: 10px; background: var(--panel2);
           color: var(--muted); border: 1px solid var(--line); }
  .badge.ok { color: #68d391; } .badge.err { color: #fc8181; border-color: #5a2a2a; }

  .kind-assistant { border-left-color: var(--assistant);
                    background: color-mix(in srgb, var(--assistant) 14%, var(--panel)); }
  .kind-command   { border-left-color: var(--command); }
  .kind-msg_sent,
  .kind-msg_recv  { border-left-color: var(--msg);
                    background: color-mix(in srgb, var(--msg) 14%, var(--panel)); }
  .kind-msg_sent .ttl, .kind-msg_recv .ttl { color: var(--msg); }
  .kind-idle      { border-left-color: var(--idle); opacity: .8; }
  .kind-system    { border-left-color: var(--system); }
  .kind-status    { border-left-color: var(--status); }
  .kind-warning   { border-left-color: var(--warning);
                    background: color-mix(in srgb, var(--warning) 16%, var(--panel)); }

  /* Reasoning blocks use normal foreground text — the muted/grey shade is reserved for the
     internal [reason] notes shown inside tool-call cards, so reasoning must not reuse it. */
  .kind-assistant pre, .kind-assistant summary .prev { color: var(--fg); }

  body.hide-assistant .kind-assistant,
  body.hide-command   .kind-command,
  body.hide-messages  .kind-msg_sent,
  body.hide-messages  .kind-msg_recv,
  body.hide-idle      .kind-idle,
  body.hide-system    .kind-system { display: none; }
  .card.nomatch { display: none; }

  #arrows { position: absolute; top: 0; left: 0; pointer-events: none; z-index: 5; overflow: visible; }
  #arrows path { fill: none; stroke: var(--msg); stroke-width: 1.6; opacity: .55; }
  #arrows .arrowhead { fill: var(--msg); stroke: none; opacity: .7; }

  #arrows .hit { stroke: transparent; stroke-width: 12; pointer-events: stroke; cursor: pointer; }

  .card.msg-link { cursor: pointer; }
  body.linking .card { opacity: .22; }
  body.linking .card.hl { opacity: 1; box-shadow: 0 0 0 1px var(--msg); }
  body.linking #arrows path { opacity: .12; }
  body.linking #arrows path.hl { opacity: 1; }

  body.pinned .card.hl { box-shadow: 0 0 0 2px var(--pin); }
  body.pinned .card.hl .ttl::after { content: " 📌"; }
  body.pinned #arrows path.hl { stroke: var(--pin); }
  body.pinned #arrows .arrowhead.hl { fill: var(--pin); }
  /* The Clear button only appears while a pin is active, in the pin colour. */
  #clear-hl { border-color: var(--pin); color: var(--pin); }
  body:not(.pinned) #clear-hl { display: none; }
</style>

const NH = DATA.hosts.length;
const COLW = 300;
const GUTTER = 64;
const cols = `${GUTTER}px repeat(${NH}, minmax(${COLW}px, 1fr))`;

function el(tag, cls, txt) { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; }
function preview(s) { s = (s || "").replace(/\s+/g, " ").trim(); return s.length > 120 ? s.slice(0, 120) + "…" : s; }

document.getElementById("exp-title").textContent = DATA.label;

// ---- filters ----
const KINDS = [["assistant","Reasoning"],["command","Tools"],["messages","Messages"],["idle","Idle"],["system","System"]];
const filterBox = document.getElementById("filters");
for (const [key, lbl] of KINDS) {
  const l = el("label"); const c = el("input"); c.type = "checkbox"; c.checked = true;
  c.onchange = () => { document.body.classList.toggle("hide-" + key, !c.checked); drawArrows(); };
  l.appendChild(c); l.appendChild(document.createTextNode(" " + lbl)); filterBox.appendChild(l);
}

// ---- sticky header ----
const hb = document.getElementById("headerbar");
hb.style.gridTemplateColumns = cols;
hb.appendChild(el("div", "gutter", ""));
for (const h of DATA.hosts) hb.appendChild(el("div", "host", h));

// ---- card builder ----
function buildCard(ev) {
  const card = el("div", "card kind-" + ev.kind);
  card.id = ev.id;
  card.dataset.text = ((ev.title || "") + " " + (ev.reason || "") + " " + (ev.body || "")).toLowerCase();

  if (ev.link != null) {
    card.classList.add("msg-link");
    card.dataset.link = ev.link;
    card.addEventListener("mouseenter", () => hoverHighlight(ev.link, true));
    card.addEventListener("mouseleave", () => hoverHighlight(ev.link, false));
    card.addEventListener("click", (e) => {
      e.stopPropagation();                          // a click inside a message block never clears
      if (e.target.closest("summary, a")) return;   // let expand/collapse and links work
      setPin(ev.link);
    });
  }

  const head = el("div", "head");
  const icon = { assistant:"💭", command:"⌘", msg_sent:"✉", msg_recv:"📨", idle:"⏸",
                 system:"⚙", status:"⚑", warning:"⚠", log:"·" }[ev.kind] || "·";
  head.appendChild(el("span", "ttl", icon + " " + (ev.title || ev.kind)));
  if (ev.exit != null) {
    const b = el("span", "badge " + (ev.exit === 0 ? "ok" : "err"), "exit " + ev.exit);
    head.appendChild(b);
  }
  card.appendChild(head);

  if (ev.reason) card.appendChild(el("div", "reason", ev.reason));

  if (ev.body) {
    const long = ev.body.length > 120 || ev.body.includes("\n");
    const collapsedByDefault = (ev.kind === "system" || ev.kind === "command" || ev.body.length > 400);
    if (long) {
      const d = el("details"); if (!collapsedByDefault) d.open = true;
      const s = el("summary");
      s.appendChild(el("span", "prev", preview(ev.body)));
      d.appendChild(s);
      d.appendChild(el("pre", null, ev.body));
      d.addEventListener("toggle", drawArrows);
      card.appendChild(d);
    } else {
      card.appendChild(el("pre", null, ev.body));
    }
  }
  return card;
}

// ---- render epochs ----
const content = document.getElementById("content");
for (const ep of DATA.epochs) {
  const sec = el("div", "epoch");
  const head = el("div", "epoch-head");
  head.appendChild(el("span", null, ep.label));
  head.appendChild(el("span", "range", ep.ts_start === ep.ts_end ? ep.ts_start : (ep.ts_start + " → " + ep.ts_end)));
  sec.appendChild(head);

  const grid = el("div", "grid");
  grid.style.gridTemplateColumns = cols;

  // Group events into cells keyed by (row, col); same-second events share a row, and same
  // host+second events stack inside one cell.
  const byRow = new Map();  // row -> Map(col -> [events])
  for (const ev of ep.events) {
    if (!byRow.has(ev.row)) byRow.set(ev.row, new Map());
    const m = byRow.get(ev.row);
    if (!m.has(ev.col)) m.set(ev.col, []);
    m.get(ev.col).push(ev);
  }
  for (const [row, m] of byRow) {
    const anyEv = m.values().next().value[0];
    const ts = el("div", "gutter-ts", anyEv.ts);
    ts.style.gridRow = (row + 1);
    grid.appendChild(ts);
    for (const [col, evs] of m) {
      const cell = el("div", "cell");
      cell.style.gridRow = (row + 1);
      cell.style.gridColumn = (col + 2);
      for (const ev of evs) cell.appendChild(buildCard(ev));
      grid.appendChild(cell);
    }
  }
  sec.appendChild(grid);
  content.appendChild(sec);
}

// ---- message arrows ----
const svg = document.getElementById("arrows");
const SVGNS = "http://www.w3.org/2000/svg";

// A clicked link stays highlighted until you click elsewhere (or the Clear button);
// hovering only previews while nothing is pinned.
let pinnedLink = null;

// Emphasise the send/recv pair (and arrow) for a link id; dim everything else. null clears.
function applyHighlight(link) {
  document.querySelectorAll(".card.hl").forEach(c => c.classList.remove("hl"));
  svg.querySelectorAll("path.hl").forEach(p => p.classList.remove("hl"));
  const lk = link == null ? null : DATA.links.find(l => l.id == link);
  document.body.classList.toggle("linking", !!lk);
  if (lk) {
    for (const id of [lk.send_id, lk.recv_id]) {
      const c = document.getElementById(id);
      if (c) c.classList.add("hl");
    }
    svg.querySelectorAll('path[data-link="' + link + '"]').forEach(p => p.classList.add("hl"));
  }
}

// Hover preview — ignored while a link is pinned.
function hoverHighlight(link, on) {
  if (pinnedLink != null) return;
  applyHighlight(on ? link : null);
}

// Click pins a link (or switches to another); clicking elsewhere clears it.
function setPin(link) {
  pinnedLink = link;
  applyHighlight(link);
  document.body.classList.add("pinned");
}
function clearPin() {
  if (pinnedLink == null) return;
  pinnedLink = null;
  applyHighlight(null);
  document.body.classList.remove("pinned");
}
// Clicking anywhere that isn't a pinnable message card/arrow clears the pin.
document.addEventListener("click", clearPin);

function drawArrows() {
  while (svg.firstChild) svg.removeChild(svg.firstChild);
  svg.setAttribute("width", document.documentElement.scrollWidth);
  svg.setAttribute("height", document.documentElement.scrollHeight);
  for (const link of DATA.links) {
    const a = document.getElementById(link.send_id), b = document.getElementById(link.recv_id);
    if (!a || !b || a.offsetParent === null || b.offsetParent === null) continue;
    const ra = a.getBoundingClientRect(), rb = b.getBoundingClientRect();
    const sx = window.scrollX, sy = window.scrollY;
    const rightward = rb.left >= ra.left;
    const x1 = (rightward ? ra.right : ra.left) + sx, y1 = ra.top + sy + ra.height / 2;
    const x2 = (rightward ? rb.left : rb.right) + sx, y2 = rb.top + sy + rb.height / 2;
    const dx = Math.max(40, Math.abs(x2 - x1) * 0.4) * (rightward ? 1 : -1);
    const d = `M ${x1} ${y1} C ${x1 + dx} ${y1}, ${x2 - dx} ${y2}, ${x2} ${y2}`;
    const p = document.createElementNS(SVGNS, "path");
    p.setAttribute("class", "wire");
    p.setAttribute("data-link", link.id);
    p.setAttribute("d", d);
    svg.appendChild(p);
    const head = document.createElementNS(SVGNS, "path");
    const dir = rightward ? 1 : -1;
    head.setAttribute("class", "arrowhead");
    head.setAttribute("data-link", link.id);
    head.setAttribute("d", `M ${x2} ${y2} l ${-6 * dir} -3 l 0 6 z`);
    svg.appendChild(head);
    // Wide invisible overlay carrying the hover interaction for this link.
    const hit = document.createElementNS(SVGNS, "path");
    hit.setAttribute("class", "hit");
    hit.setAttribute("data-link", link.id);
    hit.setAttribute("d", d);
    hit.addEventListener("mouseenter", () => hoverHighlight(link.id, true));
    hit.addEventListener("mouseleave", () => hoverHighlight(link.id, false));
    hit.addEventListener("click", (e) => { e.stopPropagation(); setPin(link.id); });
    svg.appendChild(hit);
  }
  // Arrows are rebuilt on every draw, so re-apply the pinned link's highlight to the new paths.
  if (pinnedLink != null)
    svg.querySelectorAll('path[data-link="' + pinnedLink + '"]').forEach(p => p.classList.add("hl"));
}

// ---- toolbar actions ----
document.getElementById("expand-all").onclick = () => { document.querySelectorAll("details").forEach(d => d.open = true); drawArrows(); };
document.getElementById("collapse-all").onclick = () => { document.querySelectorAll("details").forEach(d => d.open = false); drawArrows(); };
document.getElementById("clear-hl").onclick = clearPin;
const lightToggle = document.getElementById("light-toggle");
lightToggle.onchange = () => document.body.classList.toggle("light", lightToggle.checked);
const search = document.getElementById("search");
search.oninput = () => {
  const q = search.value.toLowerCase().trim();
  document.querySelectorAll(".card").forEach(c => {
    c.classList.toggle("nomatch", q !== "" && !c.dataset.text.includes(q));
  });
  drawArrows();
};

window.addEventListener("load", drawArrows);
window.addEventListener("resize", drawArrows);
drawArrows();
</script>
