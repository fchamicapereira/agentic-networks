name: Deploy website

# The site is assembled at deploy time from website/ and logs/ by
# tools/build_website.py — the same script tools/serve_website.py runs locally — so the
# built site is never committed to the repository.
on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'logs/**'
      - 'assets/timeline_template.html'
      - 'tools/build_website.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deployment finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # build_website.py uses only the standard library, so there is nothing to install.
      - name: Build site
        run: python3 tools/build_website.py --output _site --clean

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
