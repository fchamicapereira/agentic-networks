# Packaging exists for one reason: to put this checkout on Python's import path.
#
# Experiments live in experiments/ and are launched by path (see run_experiments.py and
# tools/run_in_docker.sh). Python puts the *script's* directory on sys.path, not the
# repository root, so `python experiments/kp_why_fix.py` cannot see `agentic_networks`
# without help. Installing the project in editable mode (`pip install -e .`) registers
# both packages and makes the imports resolve no matter where a script is launched from.
#
# Runtime dependencies are deliberately NOT declared here. They stay pinned in
# requirements.txt, which is the single source of truth and is what the Dockerfile and
# tools/setup.sh install. Duplicating them would risk pip trying to resolve packages that
# are provided by the system instead (mininet comes from apt, not PyPI).

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-networks"
version = "1.0.0"
description = "Instantiating the Knowledge Plane: LLM agents managing an emulated interdomain network"
readme = "README.md"
requires-python = ">=3.10"

[tool.setuptools]
packages = ["agentic_networks", "experiments"]
