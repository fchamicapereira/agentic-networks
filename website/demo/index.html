<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Knowledge Plane Demo</title>
<meta name="description" content="Watch LLM agents run an emulated interdomain network: replays of the experiments in the paper.">
<link rel="stylesheet" href="style.css">
</head>

<body>
<header class="bar">
  <div class="crumbs">
    <a href="../">Instantiating the Knowledge Plane</a>
    <span class="sep" aria-hidden="true">/</span>
    <span>Demo</span>
  </div>
  <div class="pickers">
    <label>Scenario <select id="scenario"></select></label>
    <label>Model <select id="model"></select></label>
  </div>
  <div class="detail" role="radiogroup" aria-label="Detail level">
    <span class="detail-label">Detail</span>
    <button role="radio" data-level="1" title="Agents and messages only (key 1)">Minimal</button>
    <button role="radio" data-level="2" title="Plus commands and their reasons (key 2)">Actions</button>
    <button role="radio" data-level="3" title="Plus the models' own words (key 3)">Reasoning</button>
    <button role="radio" data-level="4" title="Plus command output, prompts, warnings (key 4)">Everything</button>
  </div>
</header>

<main class="stage" data-level="2">
  <section class="graph-wrap">
    <div class="run-head">
      <h1 id="run-title">Loading…</h1>
      <p id="run-sub" class="muted"></p>
    </div>
    <p id="status" class="status" hidden></p>
    <svg id="graph" role="img" aria-label="Network topology with the agents' live state"></svg>
    <ul class="legend" aria-label="Legend">
      <li><i class="lg thinking"></i>thinking</li>
      <li><i class="lg exec"></i>running a command</li>
      <li><i class="lg dormant"></i>idle</li>
      <li><i class="lg msg"></i>message</li>
      <li><i class="lg transit"></i>provider → customer</li>
      <li><i class="lg peer"></i>peers</li>
    </ul>
    <div id="chart" class="chart-wrap" hidden></div>
    <section id="spotlight" class="spotlight idle" aria-live="polite" aria-label="Current message">
      <div class="spot-top">
        <div class="spot-head"></div>
        <span class="spot-count"></span>
      </div>
      <p class="spot-reason" hidden></p>
      <div class="spot-text"></div>
      <div class="spot-bar" aria-hidden="true"><i></i></div>
    </section>
  </section>

  <aside id="panel" class="panel" aria-label="Selected agent">
    <div class="panel-top">
      <div class="panel-head"></div>
      <button class="follow" title="Follow whichever agent acted last">Follow active</button>
    </div>
    <ol class="panel-list"></ol>
  </aside>

</main>

<footer class="transport">
  <button id="play" class="primary" aria-pressed="false">Play</button>
  <button id="prev-msg" title="Previous message (←)">◀ message</button>
  <button id="next-msg" title="Next message (→)">message ▶</button>
  <label class="speed">Speed <select id="speed"></select></label>
  <div class="scrub">
    <div id="ticks" class="ticks" aria-hidden="true"></div>
    <input id="scrub" type="range" min="0" max="1" step="any" value="0" aria-label="Replay position">
  </div>
  <span id="time" class="time">0:00 / 0:00</span>
  <label class="check" title="Squeeze every pause longer than 3 seconds (mostly waiting on the models)"><input id="shorten" type="checkbox" checked> Shorten waits</label>
  <button id="open-reports" disabled title="Available once the run has ended">Reports</button>
</footer>

<dialog id="reports" aria-label="Reports">
  <div class="dialog-head">
    <div id="report-tabs" class="tabs" role="tablist"></div>
    <button id="close-reports" aria-label="Close">Close</button>
  </div>
  <article id="report-body" class="report"></article>
</dialog>

<script src="assets/vendor/marked.min.js"></script>
<script src="assets/vendor/purify.min.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
